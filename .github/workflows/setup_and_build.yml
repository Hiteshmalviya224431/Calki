name: Generate Project & Build Calki APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/setup_and_build.yml'

permissions:
  contents: write

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Complete Calki Android Project
        run: |
          mkdir -p app/src/main/java/com/calki/app/data/local
          mkdir -p app/src/main/java/com/calki/app/data/preferences
          mkdir -p app/src/main/java/com/calki/app/data/repository
          mkdir -p app/src/main/java/com/calki/app/di
          mkdir -p app/src/main/java/com/calki/app/domain/evaluator
          mkdir -p app/src/main/java/com/calki/app/domain/model
          mkdir -p app/src/main/java/com/calki/app/ui/components
          mkdir -p app/src/main/java/com/calki/app/ui/screens
          mkdir -p app/src/main/java/com/calki/app/ui/theme
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/calki/app/domain/evaluator

          cat << 'EOF' > .gitignore
          *.iml
          .gradle
          /local.properties
          /.idea
          .DS_Store
          /build
          /captures
          .externalNativeBuild
          .cxx
          local.properties
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Calki"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
              id("com.google.dagger.hilt.android") version "2.52" apply false
              id("com.google.devtools.ksp") version "2.0.20-1.0.25" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.dagger.hilt.android")
              id("com.google.devtools.ksp")
