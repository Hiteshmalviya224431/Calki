      - name: Commit Generated Project Files to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Generate complete Calki Android project"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests & Build Debug APK
        run: gradle testDebugUnitTest assembleDebug

      - name: Upload Ready-to-Install Calki APK
        uses: actions/upload-artifact@v4
        with:
          name: Calki-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
