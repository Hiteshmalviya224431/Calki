                          row.forEach { key ->
                              CalkiKeyButton(
                                  key = key,
                                  hapticsEnabled = hapticsEnabled,
                                  soundEnabled = soundEnabled,
                                  onClick = { onKeyPress(key) },
                                  onLongClick = if (key == CalculatorKey.CLEAR) onLongPressClear else null,
                                  modifier = Modifier.weight(1f)
