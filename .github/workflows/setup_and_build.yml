                      hapticsEnabled = prefs[Keys.HAPTICS_ENABLED] ?: true,
                      soundEnabled = prefs[Keys.SOUND_ENABLED] ?: false,
                      decimalPlaces = prefs[Keys.DECIMAL_PLACES] ?: 8,
